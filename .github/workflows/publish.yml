name: Publish package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm CLI
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Registry is up to date
        run: pnpm run check:registry

      - name: Build
        run: pnpm run build

      # Trusted Publishing (OIDC) — no npm token needed. Requires:
      #  - a Trusted Publisher configured for this package on npmjs.com
      #    (org/user + repo + workflow filename = publish.yml)
      #  - `id-token: write` above, npm CLI >= 11.5.1, Node >= 22.14.0
      # pnpm doesn't implement the OIDC exchange yet (pnpm/pnpm#9812), so the
      # actual publish has to go through the real npm CLI.
      - name: Publish to npm
        run: npm publish --provenance --access public
